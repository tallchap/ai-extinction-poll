<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Bedtime Gym</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #a78bfa; --me: #1f2937;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px calc(0px + 12px); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 2;
  }
  header h1 { font-size: 16px; font-weight: 600; flex: 1; }
  header h1 span { color: var(--accent); }
  header button {
    background: none; border: 1px solid var(--border); color: var(--dim);
    border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: var(--me); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
  .coach { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .coach.typing { color: var(--dim); }
  .coach.typing::after { content: "…"; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .hint { color: var(--dim); text-align: center; font-size: 14px; margin: auto; padding: 24px; }
  form {
    display: flex; gap: 8px; padding: 12px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    border-top: 1px solid var(--border); background: var(--bg);
  }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    font: inherit; max-height: 40vh; min-height: 44px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  form button {
    align-self: flex-end; background: var(--accent); color: #0d1117; border: 0;
    border-radius: 12px; padding: 0 18px; height: 44px; font: inherit; font-weight: 700; cursor: pointer;
  }
  form button:disabled { opacity: .4; }
  footer { text-align: center; color: var(--dim); font-size: 11px; padding: 0 0 6px; }
</style>
</head>
<body>
<header>
  <h1>🌙 bedtime <span>gym</span></h1>
  <button id="reset" title="New session">↺ new</button>
</header>
<div id="chat"><div class="hint">Dump your stream of consciousness — what you're doing, what's keeping you up, how last night went. The coach figures out the rest and logs it.</div></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="stream of consciousness…" enterkeyhint="send"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<footer>bedtime-gym · __SHA__</footer>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("f");
const ta = document.getElementById("t");
const sendBtn = document.getElementById("send");
const KEY = "bg-chat";
const MAX_AGE = 6 * 3600 * 1000; // fresh conversation after 6h away

let messages = [];
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && Date.now() - saved.ts < MAX_AGE) messages = saved.messages || [];
} catch {}

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), messages })); } catch {}
}
function bubble(role, text) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "me" : "coach");
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
function render() {
  chat.innerHTML = messages.length
    ? ""
    : '<div class="hint">Dump your stream of consciousness — what you\'re doing, what\'s keeping you up, how last night went. The coach figures out the rest and logs it.</div>';
  for (const m of messages) bubble(m.role, m.content);
}
render();

ta.addEventListener("input", () => {
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, innerHeight * 0.4) + "px";
});

document.getElementById("reset").onclick = () => {
  if (messages.length && !confirm("Start a new session?")) return;
  messages = []; persist(); render();
};

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = ta.value.trim();
  if (!text || sendBtn.disabled) return;
  ta.value = ""; ta.style.height = "auto";
  messages.push({ role: "user", content: text });
  persist(); render();
  const typing = bubble("assistant", "");
  typing.classList.add("typing");
  sendBtn.disabled = true;
  try {
    const r = await fetch("/bedtime/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    messages.push({ role: "assistant", content: j.reply });
  } catch (err) {
    messages.push({ role: "assistant", content: "⚠️ " + err.message + " — send again." });
  }
  persist(); render();
  sendBtn.disabled = false;
});
</script>
</body>
</html>
